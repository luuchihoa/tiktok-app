<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal Navy Liturgical Background -->
    <radialGradient id="bgGradFinal" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#1c3560" />
      <stop offset="50%" stop-color="#0e1d38" />
      <stop offset="85%" stop-color="#070f1e" />
      <stop offset="100%" stop-color="#03070f" />
    </radialGradient>

    <!-- Brilliant Burnished Gold Gradients -->
    <linearGradient id="goldRimFinal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="crossGoldFinal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="crossBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Holy Bible Gradients -->
    <linearGradient id="bookCoverFinal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="40%" stop-color="#881337" />
      <stop offset="80%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#2e020e" />
    </linearGradient>

    <linearGradient id="pagesFinal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Glorious Halo Gradient -->
    <radialGradient id="haloFinal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Rich Elevation Shadow -->
    <filter id="dropShadowFinal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGradFinal)" stroke="url(#goldRimFinal)" stroke-width="16" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.55" />

  <!-- Heavenly Radiance / Rays of Resurrection Glory -->
  <circle cx="256" cy="175" r="135" fill="url(#haloFinal)" />

  <g opacity="0.8" fill="#fef08a">
    <!-- Major Beams -->
    <polygon points="256,36 263,125 249,125" />
    <polygon points="362,72 316,145 307,136" />
    <polygon points="406,175 315,175 315,164" />
    <polygon points="150,72 205,136 196,145" />
    <polygon points="106,175 197,164 197,175" />
    <!-- Secondary Beams -->
    <polygon points="312,48 288,130 281,126" opacity="0.65" />
    <polygon points="200,48 231,126 224,130" opacity="0.65" />
    <polygon points="390,118 316,160 310,152" opacity="0.65" />
    <polygon points="122,118 202,152 196,160" opacity="0.65" />
  </g>

  <!-- Open Holy Bible Foundation (Lời Chúa) -->
  <g filter="url(#dropShadowFinal)">
    <!-- Red Liturgical Leather Cover -->
    <path d="M56 362 C132 334 208 348 256 374 C304 348 380 334 456 362 L448 412 C376 382 304 398 256 426 C208 398 136 382 64 412 Z" 
          fill="url(#bookCoverFinal)" stroke="url(#goldRimFinal)" stroke-width="6" stroke-linejoin="round" />

    <!-- Left Open Parchment Page -->
    <path d="M76 352 C144 326 216 338 254 362 L254 394 C216 370 144 358 76 384 Z" 
          fill="#fef08a" opacity="0.6" />
    <path d="M80 344 C148 318 218 330 254 354 L254 386 C218 362 148 350 80 376 Z" 
          fill="url(#pagesFinal)" stroke="#d97706" stroke-width="2.5" />

    <!-- Right Open Parchment Page -->
    <path d="M436 352 C368 326 296 338 258 362 L258 394 C296 370 368 358 436 384 Z" 
          fill="#fef08a" opacity="0.6" />
    <path d="M432 344 C364 318 294 330 258 354 L258 386 C294 362 364 350 432 376 Z" 
          fill="url(#pagesFinal)" stroke="#d97706" stroke-width="2.5" />

    <!-- Scripture Lines (Golden Scripture accents) -->
    <line x1="112" y1="346" x2="222" y2="340" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="112" y1="357" x2="222" y2="351" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="112" y1="368" x2="195" y2="362" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <line x1="290" y1="340" x2="400" y2="346" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="290" y1="351" x2="400" y2="357" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="317" y1="362" x2="400" y2="368" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Liturgical Red Ribbon Bookmark -->
    <path d="M251 350 L261 350 L265 440 L256 428 L247 440 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
  </g>

  <!-- Majestic Latin Holy Cross (Thánh Giá Cứu Độ) -->
  <g filter="url(#dropShadowFinal)">
    <!-- Deep Amber Base Contour -->
    <path d="M226 70 L286 70 L286 146 L372 146 L372 206 L286 206 L286 352 L226 352 L226 206 L140 206 L140 146 L226 146 Z" 
          fill="#451a03" />

    <!-- Main Solid Gold Cross Body -->
    <path d="M230 74 L282 74 L282 150 L368 150 L368 202 L282 202 L282 348 L230 348 L230 202 L144 202 L144 150 L230 150 Z" 
          fill="url(#crossGoldFinal)" stroke="#fffbeb" stroke-width="4" stroke-linejoin="round" />

    <!-- 3D Bevel Facets -->
    <path d="M232 76 L256 76 L256 346 L232 346 Z" fill="url(#crossBevel)" />
    <path d="M146 152 L366 152 L366 174 L146 174 Z" fill="url(#crossBevel)" opacity="0.6" />

    <!-- Inner Core Filigree Inlay -->
    <path d="M245 90 L267 90 L267 163 L350 163 L350 189 L267 189 L267 330 L245 330 L245 189 L162 189 L162 163 L245 163 Z" 
          fill="none" stroke="#fffbeb" stroke-width="2" opacity="0.7" />

    <!-- Sacred Center Diamond Emblem -->
    <polygon points="256,160 277,176 256,192 235,176" fill="#ffffff" stroke="#d97706" stroke-width="2.5" />
    <polygon points="256,165 270,176 256,187 242,176" fill="url(#crossGoldFinal)" />
  </g>

  <!-- Divine Celestial Stars -->
  <g fill="#ffffff" opacity="0.95">
    <polygon points="95,225 99,234 108,237 99,240 95,249 91,240 82,237 91,234" />
    <polygon points="417,225 421,234 430,237 421,240 417,249 413,240 404,237 413,234" />
    <polygon points="256,38 259,46 267,49 259,52 256,60 253,52 245,49 253,46" />
  </g>
</svg>